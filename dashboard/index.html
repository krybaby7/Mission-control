<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mission Control</title>
<style>
/* One calm column. The lamp comes first, then what needs you, then the features, then the allowance.
   Every status is icon + word + colour. No style attributes anywhere (the CSP forbids them): classes and data-tone only. */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --bg: #edf1f5; --surface: #ffffff; --surface-2: #f4f7fa;
  --ink: #13202c; --ink-2: #3a4a5c; --muted: #526273;
  --line: #d3dce5; --line-strong: #a3b2c3;
  --accent: #0b5f86; --accent-ink: #ffffff; --focus: #0b5f86;

  --ok-fg: #0d6b3d;   --ok-bg: #e1f4e9;   --ok-line: #7cc29c;   --ok-solid: #1a8a52;
  --warn-fg: #7a4600; --warn-bg: #fff0cf; --warn-line: #e0a53a; --warn-solid: #b86f00;
  --bad-fg: #9a1c24;  --bad-bg: #fde5e6;  --bad-line: #e58a90;  --bad-solid: #c0262d;
  --info-fg: #134f9a; --info-bg: #e0edfc; --info-line: #8bb4e8; --info-solid: #2563b0;
  --idle-fg: #46566a; --idle-bg: #e8edf2; --idle-line: #b5c1cd; --idle-solid: #6b7a8a;

  --stripe-a: #fff0cf; --stripe-b: #f6d98f;
  --shadow: 0 1px 2px rgba(19, 32, 44, 0.06), 0 6px 18px rgba(19, 32, 44, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a; --surface: #141e28; --surface-2: #1a2632;
    --ink: #e9eff5; --ink-2: #bac7d4; --muted: #9bacbc;
    --line: #27374a; --line-strong: #43586f;
    --accent: #6cc3ea; --accent-ink: #06222f; --focus: #8fd3f2;
    --ok-fg: #7fe0aa;   --ok-bg: #12301f;   --ok-line: #2f7a50;   --ok-solid: #3fbf7c;
    --warn-fg: #f6c866; --warn-bg: #35280a; --warn-line: #8a6516; --warn-solid: #f0b13a;
    --bad-fg: #ff9a9f;  --bad-bg: #3a1517;  --bad-line: #8c3a40;  --bad-solid: #ff6b73;
    --info-fg: #9cc4ff; --info-bg: #122846; --info-line: #2f5c99; --info-solid: #6aa5f5;
    --idle-fg: #b3c0cd; --idle-bg: #1d2935; --idle-line: #3a4b5c; --idle-solid: #8394a5;
    --stripe-a: #35280a; --stripe-b: #46340c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a; --surface: #141e28; --surface-2: #1a2632;
  --ink: #e9eff5; --ink-2: #bac7d4; --muted: #9bacbc;
  --line: #27374a; --line-strong: #43586f;
  --accent: #6cc3ea; --accent-ink: #06222f; --focus: #8fd3f2;
  --ok-fg: #7fe0aa;   --ok-bg: #12301f;   --ok-line: #2f7a50;   --ok-solid: #3fbf7c;
  --warn-fg: #f6c866; --warn-bg: #35280a; --warn-line: #8a6516; --warn-solid: #f0b13a;
  --bad-fg: #ff9a9f;  --bad-bg: #3a1517;  --bad-line: #8c3a40;  --bad-solid: #ff6b73;
  --info-fg: #9cc4ff; --info-bg: #122846; --info-line: #2f5c99; --info-solid: #6aa5f5;
  --idle-fg: #b3c0cd; --idle-bg: #1d2935; --idle-line: #3a4b5c; --idle-solid: #8394a5;
  --stripe-a: #35280a; --stripe-b: #46340c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

/* A tone sets four variables once; chips, tiles, cards and the lamp all read them. */
[data-tone="ok"]   { --t-fg: var(--ok-fg);   --t-bg: var(--ok-bg);   --t-line: var(--ok-line);   --t-solid: var(--ok-solid); }
[data-tone="warn"] { --t-fg: var(--warn-fg); --t-bg: var(--warn-bg); --t-line: var(--warn-line); --t-solid: var(--warn-solid); }
[data-tone="bad"]  { --t-fg: var(--bad-fg);  --t-bg: var(--bad-bg);  --t-line: var(--bad-line);  --t-solid: var(--bad-solid); }
[data-tone="info"] { --t-fg: var(--info-fg); --t-bg: var(--info-bg); --t-line: var(--info-line); --t-solid: var(--info-solid); }
[data-tone="idle"], [data-tone="lost"] { --t-fg: var(--idle-fg); --t-bg: var(--idle-bg); --t-line: var(--idle-line); --t-solid: var(--idle-solid); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; overflow-wrap: break-word; overflow-wrap: anywhere; }
body.sheet-open { overflow: hidden; }
h1, h2, h3, h4, p, ul, ol, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 15px; line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }

/* page frame */
.wrap { max-width: 1180px; margin-inline: auto; padding: 16px 16px 40px; display: grid; gap: 16px; }
@media (min-width: 760px) { .wrap { padding-inline: 24px; padding-top: 24px; } }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px; }
.brand { font-size: 24px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.2; }
.fresh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 15px; color: var(--muted); }
.notice { background: var(--warn-bg); color: var(--warn-fg); border: 2px solid var(--warn-line); border-radius: 12px; padding: 12px 16px; font-weight: 700; }

/* demo banner */
.demo-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 16px; background: repeating-linear-gradient(135deg, var(--stripe-a) 0 14px, var(--stripe-b) 14px 28px); border-bottom: 2px solid var(--warn-line); color: var(--warn-fg); }
.demo-note { font-weight: 800; font-size: 15px; flex: 0 0 auto; }
.demo-links { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 280px; min-width: 0; padding-block: 2px; }
.demo-link { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; text-transform: capitalize; }
.demo-link[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border-bottom: 1px solid var(--line-strong); }
.tab { min-height: 52px; padding: 4px 6px; background: none; border: 0; border-bottom: 4px solid transparent; margin-bottom: -1px; font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--ink-2); text-align: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (min-width: 640px) {
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 0 20px; }
}
.panel { display: grid; gap: 18px; align-content: start; }
.stack { display: grid; gap: 18px; align-content: start; }
.stack:empty { display: none; }
.gone .panel > :not(.lamp) { filter: grayscale(1); opacity: 0.95; }
h2 { font-size: 24px; line-height: 1.2; font-weight: 800; }
h3 { font-size: 20px; line-height: 1.25; font-weight: 750; }
h4 { font-size: 18px; line-height: 1.3; font-weight: 700; }
.section-label { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* chips, tags, buttons */
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--t-line); background: var(--t-bg); color: var(--t-fg); font-size: 15px; font-weight: 700; line-height: 1.1; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 600; line-height: 1.3; }
.tag.recovered { border-color: var(--info-line); background: var(--info-bg); color: var(--info-fg); }
.tag.now { border-color: var(--accent); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; line-height: 1.2; text-align: center; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .linkbtn { color: #084a69; } }
:root[data-theme="light"] .linkbtn { color: #084a69; }

/* the lamp */
.lamp { border: 2px solid var(--t-line); background: var(--t-bg); border-radius: 16px; padding: 20px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.lamp[data-tone="lost"] { background: repeating-linear-gradient(135deg, var(--idle-bg) 0 10px, var(--surface-2) 10px 20px); }
.lamp-head { display: flex; align-items: center; gap: 14px; color: var(--t-fg); }
.lamp-icon { display: inline-flex; }
.lamp-icon .ic { width: 46px; height: 46px; stroke-width: 1.8; }
.lamp-word { font-size: clamp(28px, 7.4vw, 44px); font-weight: 800; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; }
@media (min-width: 600px) { .lamp-icon .ic { width: 52px; height: 52px; } }
.lamp-sentence { font-size: 20px; line-height: 1.35; font-weight: 700; color: var(--ink); max-width: 60ch; }
.lamp-lines { display: grid; gap: 6px; border-top: 1px solid var(--t-line); padding-top: 12px; color: var(--ink); }
.lamp-lines:empty { display: none; }
.lamp-lines.old { color: var(--muted); }
.lamp-lines .label { font-weight: 700; }

/* needs-you strip */
.strip { background: var(--surface); border: 2px solid var(--t-line); border-radius: 14px; padding: 6px 8px 8px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.strip-title { display: flex; align-items: center; gap: 10px; padding: 8px 8px 2px; font-size: 18px; font-weight: 800; color: var(--t-fg); }
.strip-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-weight: 600; color: var(--ink); }
.strip-item .ic { color: var(--t-fg); }
.strip-item:hover { background: var(--surface-2); }
.strip-item .go { margin-left: auto; color: var(--accent); }
.strip-text { display: grid; gap: 1px; min-width: 0; }
.strip-sub { font-size: 15px; font-weight: 400; line-height: 1.4; color: var(--ink-2); }
.strip.calm { padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink-2); box-shadow: none; }
.strip.calm .ic { color: var(--ok-solid); }
.strip.calm.muted { border-color: var(--line); font-weight: 600; color: var(--muted); }
.linkrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); text-align: left; font-weight: 700; color: var(--ink); box-shadow: var(--shadow); }
.linkrow .ic { color: var(--accent); }
.linkrow .go { margin-left: auto; }

/* features */
.features { display: grid; gap: 14px; }
.group { display: grid; gap: 12px; }
.mission-head { background: var(--surface); border: 1px solid var(--line-strong); border-left: 6px solid var(--t-solid); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.mission-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.mission-title h3 { min-width: 0; }
.kind { font-size: 14px; font-weight: 600; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 9px; }
.mission-sentence { color: var(--ink); }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 2px; }
.step { position: relative; display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; font-size: 14px; line-height: 1.2; color: var(--muted); }
.step .dot { position: relative; z-index: 1; display: inline-flex; background: var(--surface); border-radius: 50%; color: var(--muted); }
.step .dot .ic { width: 26px; height: 26px; }
.step::before { content: ""; position: absolute; top: 12px; left: -50%; right: 50%; height: 3px; background: var(--line-strong); }
.step:first-child::before { display: none; }
.step.done { color: var(--ink-2); }
.step.done .dot { color: var(--ok-solid); }
.step.done::before, .step.current::before { background: var(--ok-solid); }
.step.current { color: var(--ink); font-weight: 800; }
.step.current .dot { color: var(--accent); }
.step.current.stopped .dot { color: var(--bad-solid); }
.step.current.paused .dot { color: var(--warn-solid); }
.step .here { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.tiles { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--t-solid); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.tile.is-now { border-color: var(--accent); border-left-color: var(--accent); border-width: 2px 2px 2px 6px; }
.tile-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tile-title { overflow-wrap: anywhere; }
.tile.compact { gap: 6px; }
.firsttry { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.firsttry .ic { color: var(--ok-solid); }
.donebox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.donebox > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.donebox > summary::-webkit-details-marker { display: none; }
.donebox > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); flex: none; }
.donebox[open] > summary::before { transform: rotate(45deg); }
.donebox .tiles { padding: 4px 12px 14px; }
.reason { color: var(--ink-2); }
.steps-line { display: grid; gap: 6px; }
.steps-text { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--idle-solid); display: block; flex: none; }
.pip.on.first { background: var(--info-solid); border-color: var(--info-solid); }
.pip.on.reinf { background: var(--warn-solid); border-color: var(--warn-solid); }
.tile-actions { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.ai { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--idle-solid); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; }
.ai-tag { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 14px; font-weight: 600; color: var(--idle-fg); line-height: 1.35; }
.ai-tag .ic { width: 1.15em; height: 1.15em; margin-top: 1px; }
.ai-text { color: var(--ink); }
.ai-label { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; font-weight: 600; color: var(--idle-fg); line-height: 1.35; }
.ai-label .ic { width: 1.15em; height: 1.15em; margin-top: 1px; }
.quote { color: var(--ink); border-left: 3px solid var(--line-strong); padding-left: 10px; }

/* the quiet row of earlier work that is still open */
.earlier { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.earlier summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.earlier summary::-webkit-details-marker { display: none; }
.earlier summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); flex: none; }
.earlier[open] summary::before { transform: rotate(45deg); }
.earlier-list { display: grid; gap: 10px; padding: 4px 16px 16px; }
.earlier-item { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.earlier-item:first-child { border-top: 0; padding-top: 0; }

/* allowance */
.allowance { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.banner { display: flex; align-items: flex-start; gap: 10px; background: var(--info-bg); color: var(--info-fg); border: 1px solid var(--info-line); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.providers { display: grid; gap: 0; }
@media (min-width: 900px) { .providers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; } }
.prov { display: grid; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); align-content: start; }
.prov-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.prov-head .name { font-size: 20px; font-weight: 800; }
.pills .name { font-weight: 800; }
.win { display: grid; gap: 4px; }
.win-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 15px; }
.track { position: relative; height: 16px; border-radius: 8px; background: var(--idle-bg); border: 1px solid var(--line-strong); }
.fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px 0 0 7px; background: var(--info-solid); }
.fill.warn { background: var(--warn-solid); }
.fill.bad { background: var(--bad-solid); }
.fill.over { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0 6px, transparent 6px 12px); }
.tick { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; }
.cap { position: relative; height: 22px; font-size: 14px; color: var(--ink-2); }
.cap span { position: absolute; top: 2px; transform: translateX(-100%); white-space: nowrap; padding-right: 6px; }
.foot-note { font-size: 14px; color: var(--muted); }

/* needs you tab */
.cards { display: grid; gap: 18px; max-width: 880px; }
.card { background: var(--surface); border: 2px solid var(--t-line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: calc(16px + var(--sticky-top, 0px)); }
.card-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; background: var(--t-bg); }
.card-h .ic { width: 30px; height: 30px; color: var(--t-fg); margin-top: 1px; }
.card-h h3 { font-size: 21px; color: var(--ink); }
.card-h .of { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.card-body { padding: 4px 18px 6px; display: grid; }
.sect { padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.sect:last-child { border-bottom: 0; }
.card-foot { padding: 4px 18px 16px; display: flex; flex-wrap: wrap; gap: 10px; }
.look { display: grid; gap: 6px; }

/* timeline */
.timeline { display: grid; gap: 6px; max-width: 880px; }
.day { font-size: 15px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.tl-mission { font-size: 17px; font-weight: 750; margin-top: 8px; }
.tl { display: grid; }
.tl-item { display: grid; grid-template-columns: 48px 26px minmax(0, 1fr); gap: 0 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.tl-item:first-child { border-top: 0; }
.tl-time { font-family: var(--font-mono); font-size: 15px; color: var(--muted); padding-top: 1px; }
.tl-item > .ic { color: var(--t-fg); width: 22px; height: 22px; margin-top: 2px; }
.tl-body { display: grid; gap: 6px; }
.tl-item[data-tone="bad"] .tl-text { font-weight: 700; }

/* results */
.results { display: grid; gap: 18px; max-width: 980px; }
.verdict { display: flex; align-items: flex-start; gap: 14px; border: 2px solid var(--t-line); background: var(--t-bg); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.verdict .ic { width: 44px; height: 44px; color: var(--t-fg); stroke-width: 1.8; }
.verdict-word { font-size: 28px; font-weight: 800; line-height: 1.1; color: var(--t-fg); text-transform: uppercase; letter-spacing: 0.03em; }
.verdict-sentence { font-size: 19px; font-weight: 650; color: var(--ink); margin-top: 4px; }
.dmission { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 16px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.list-block { display: grid; gap: 8px; }
.list { display: grid; gap: 10px; }
.list li { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .name { font-weight: 700; }
.ticks { display: grid; gap: 10px; }
@media (min-width: 760px) { .ticks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tick-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border: 1px solid var(--line); border-left: 6px solid var(--t-solid); border-radius: 10px; background: var(--surface); align-items: start; }
.tick-row > .ic { width: 28px; height: 28px; color: var(--t-fg); }
.tick-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.tick-label { font-weight: 800; }
.tick-state { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--t-line); background: var(--t-bg); color: var(--t-fg); }
.caveat { display: flex; align-items: flex-start; gap: 6px; color: var(--warn-fg); font-weight: 600; }
.caveat .ic { margin-top: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 10px 20px; }
.pills .p { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.notes { display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 16px; color: var(--ink-2); font-weight: 600; max-width: 880px; }

/* global bar */
.gbar { position: sticky; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line-strong); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px rgba(19, 32, 44, 0.08); }
.gbar-in { max-width: 1180px; margin-inline: auto; display: flex; gap: 10px; }
.gbar-in .btn { flex: 1.6 1 0; padding: 0 10px; }
.gbar-in .btn.quiet { flex-grow: 1; }
@media (min-width: 760px) { .gbar-in { justify-content: flex-end; padding-inline: 8px; } .gbar-in .btn, .gbar-in .btn.quiet { flex: 0 0 auto; min-width: 220px; padding: 0 18px; } }

/* the sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 20, 0.62); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 580px; max-height: calc(100vh - 12px); max-height: calc(100dvh - 12px); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 50px rgba(0, 0, 0, 0.35); border: 1px solid var(--line-strong); }
.sheet:focus { outline: none; }
.sheet-body { overflow: auto; min-height: 0; padding: 20px 20px 8px; display: grid; gap: 14px; align-content: start; }
@media (min-width: 700px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 18px; } }
.sheet h2 { font-size: 26px; }
.cannot { font-weight: 600; }
.msg { width: 100%; min-height: 84px; resize: vertical; border: 2px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); color: var(--ink); line-height: 1.45; }
.own { width: 100%; min-height: 64px; resize: vertical; border: 2px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); line-height: 1.45; }
.own::placeholder { color: var(--muted); }
.phrases { display: flex; flex-wrap: wrap; gap: 8px; }
.phrase { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line-strong); background: var(--surface); font-weight: 600; }
.phrase[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 6px; }
.field label, .field .section-label { font-weight: 700; }
.status { min-height: 1.45em; font-weight: 700; color: var(--ok-fg); }
.status.fail { color: var(--warn-fg); }
.btn[aria-disabled="true"] { background: var(--surface-2); border-color: var(--line-strong); color: var(--muted); cursor: default; }
.stop-note { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.sheet-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.sheet-btns .btn { flex: 1 1 140px; }
.sheet-btns .status { flex: 1 0 100%; text-align: left; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

  var DEMO = null;
  if (demoNode) {
    try { DEMO = JSON.parse(demoNode.textContent || "{}"); } catch (e) { DEMO = {}; }
  }

  var state = {
    snap: null,
    sig: "",
    lastOk: 0,
    level: 0,
    firstFailed: false,
    versionBad: false,
    tab: "now",
    earlierOpen: false,
    doneOpen: {},
    underKey: "",
    pollTimer: 0,
    polling: false
  };

  function nowMs() { return DEMO && state.snap ? state.lastOk : Date.now(); }

  function freshness() {
    var f = state.snap && state.snap.freshness;
    return {
      poll: f && f.pollEveryMs > 0 ? f.pollEveryMs : POLL_DEFAULT_MS,
      stale: f && f.staleAfterMs > 0 ? f.staleAfterMs : STALE_DEFAULT_MS,
      gone: f && f.notRespondingAfterMs > 0 ? f.notRespondingAfterMs : GONE_DEFAULT_MS
    };
  }

  // ---------------------------------------------------------------------------------------------
  // Tell the leader: buttons and the sheet. Nothing is sent anywhere; the sheet only helps to copy a sentence.
  // ---------------------------------------------------------------------------------------------
  // `label` is the words on the button (default: Tell the leader about this); `quiet` draws it as a second choice.
  function tellButton(template, key, titleNode, small, label, quiet) {
    var b = el("button", small ? "btn quiet small" : quiet ? "btn quiet" : "btn", label || W.tell);
    b.type = "button";
    b.setAttribute("data-key", key);
    if (titleNode) b.setAttribute("aria-describedby", ensureId(titleNode, "t"));
    b.addEventListener("click", function () { openSheet("tell", template, b); });
    return b;
  }

  var sheet = { open: false, mode: "tell", template: "", answer: "", opener: null, openerKey: "" };

  function composeMessage() {
    if (sheet.mode === "stop") return sheet.template;
    var answer = sheet.answer.trim();
    if (!answer) return sheet.template;
    if (sheet.template.indexOf(PLACEHOLDER) < 0) return sheet.template + " " + answer;
    return sheet.template.split(PLACEHOLDER).join(answer);
  }

  // Copy is for a finished message. With nothing chosen the preview still holds the placeholder, so Copy waits.
  // A sentence with nothing to fill in (an approval) is complete as it is, like the stop sentence.
  function canCopy() { return sheet.mode === "stop" || sheet.template.indexOf(PLACEHOLDER) < 0 || sheet.answer.trim() !== ""; }

  function paintSheet() {
    $("sheet-msg").value = composeMessage();
    $("sheet-copy").setAttribute("aria-disabled", canCopy() ? "false" : "true");
    var pressed = sheet.answer.trim();
    var buttons = $("sheet-phrases").children;
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", pressed !== "" && buttons[i].textContent === pressed ? "true" : "false");
    }
  }

  function setStatus(text, failed) {
    var s = $("sheet-status");
    s.textContent = text;
    s.className = failed ? "status fail" : "status";
  }

  function openSheet(mode, template, opener) {
    var snap = state.snap;
    if (!snap) return;
    var leader = snap.leader;
    sheet.open = true;
    sheet.mode = mode;
    sheet.template = template;
    sheet.answer = "";
    sheet.opener = opener || null;
    sheet.openerKey = opener ? opener.getAttribute("data-key") || opener.id || "" : "";
    var stop = mode === "stop";
    var ready = !stop && template.indexOf(PLACEHOLDER) < 0;
    $("sheet-cannot").textContent = stop ? W.cannotStop : ready ? W.cannotSendReady : W.cannotSend;
    $("sheet-stop").hidden = !stop;
    $("sheet-stop").textContent = stop ? leader.stopNote : "";
    $("sheet-phrases-box").hidden = stop || ready;
    $("sheet-own-box").hidden = stop || ready;
    $("sheet-hint").textContent = leader.pasteHint;
    $("sheet-can").textContent = leader.canDo;
    $("sheet-own").value = "";
    setStatus("", false);
    var box = $("sheet-phrases");
    clear(box);
    leader.quickPhrases.forEach(function (phrase) {
      var p = el("button", "phrase", phrase);
      p.type = "button";
      p.setAttribute("aria-pressed", "false");
      p.addEventListener("click", function () {
        sheet.answer = sheet.answer.trim() === phrase ? "" : phrase;
        $("sheet-own").value = sheet.answer;
        setStatus("", false);
        paintSheet();
      });
      box.appendChild(p);
    });
    paintSheet();
    $("scrim").hidden = false;
    $("page").setAttribute("inert", "");
    document.body.classList.add("sheet-open");
    $("sheet").focus();
  }

  function closeSheet() {
    if (!sheet.open) return;
    sheet.open = false;
    $("scrim").hidden = true;
    $("page").removeAttribute("inert");
    document.body.classList.remove("sheet-open");
    var back = sheet.opener;
    if (back && !document.contains(back) && sheet.openerKey) {
      back = document.querySelector('[data-key="' + cssEscape(sheet.openerKey) + '"]') || document.getElementById(sheet.openerKey);
    }
    sheet.opener = null;
    if (back && back.focus) back.focus({ preventScroll: true });
  }

  function cssEscape(value) {
    return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/["\\]/g, "\\$&");
  }

  // Copy: the clipboard API when the page is allowed to use it, else select the text and use the old command
  // (plain http over a LAN has no navigator.clipboard).
  function copyMessage() {
    if (!canCopy()) { setStatus(W.copyFirst, true); return; }
    var box = $("sheet-msg");
    var text = box.value;
    function legacy() {
      var ok = false;
      try {
        box.focus();
        box.select();
        box.setSelectionRange(0, text.length);
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      return ok;
    }
    function done(ok) {
      if (ok) {
        setStatus(W.copied, false);
      } else {
        setStatus(state.snap.leader.copyFailHint, true);
        box.focus();
        box.select();
        box.setSelectionRange(0, text.length);
      }
    }
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacy()); });
    } else {
      done(legacy());
    }
  }

  function sheetFocusables() {
    var all = $("sheet").querySelectorAll("button, textarea, [tabindex]:not([tabindex='-1'])");
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (!n.disabled && n.offsetParent !== null) out.push(n);
    }
    return out;
  }

  $("sheet-copy").addEventListener("click", copyMessage);
  $("sheet-close").addEventListener("click", closeSheet);
  $("sheet-own").addEventListener("input", function () {
    sheet.answer = $("sheet-own").value;
    setStatus("", false);
    paintSheet();
  });
  $("scrim").addEventListener("click", function (e) { if (e.target === $("scrim")) closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.open) return;
    if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
    if (e.key !== "Tab") return;
    var list = sheetFocusables();
    if (!list.length) return;
    var first = list[0];
    var last = list[list.length - 1];
    var active = document.activeElement;
    if (e.shiftKey && (active === first || active === $("sheet"))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
    else if (!$("sheet").contains(active)) { e.preventDefault(); first.focus(); }
  });
  $("gbar-tell").addEventListener("click", function () { if (state.snap) openSheet("tell", state.snap.leader.globalSentence, $("gbar-tell")); });
  $("gbar-stop").addEventListener("click", function () { if (state.snap) openSheet("stop", state.snap.leader.stopSentence, $("gbar-stop")); });
  $("gbar-tell").setAttribute("data-key", "gbar-tell");
  $("gbar-stop").setAttribute("data-key", "gbar-stop");

  // ---------------------------------------------------------------------------------------------
  // Now
  // ---------------------------------------------------------------------------------------------
  function stepper(m) {
    var list = el("ol", "steps");
    var anyDone = false;
    m.progress.forEach(function (s) { if (s.state !== "todo") anyDone = true; });
    if (!anyDone || !m.readable) return null;
    // Always drawn in the order of the five steps, whatever order the list arrives in.
    var ordered = m.progress.slice().sort(function (a, b) { return STEP_IDS.indexOf(a.id) - STEP_IDS.indexOf(b.id); });
    ordered.forEach(function (s) {
      // A mission that stopped or paused did not get past its current step: say so instead of drawing it as work.
      var halted = s.state === "current" && (m.state === "needs_you" || m.state === "paused");
      var li = el("li", "step " + s.state + (halted ? (m.state === "needs_you" ? " stopped" : " paused") : ""));
      if (s.state === "current") li.setAttribute("aria-current", "step");
      var dot = el("span", "dot");
      dot.appendChild(ic(halted ? (m.state === "needs_you" ? "sq" : "pause") : STEP_LOOK[s.state] || "hollow"));
      var label = s.word;
      if (s.id === "build" && m.repairLap) label = s.word + " (" + W.repairRound + ")";
      add(li, dot, el("span", "", label), halted ? el("span", "here", m.state === "needs_you" ? W.stoppedHere : W.pausedHere) : el("span", "sr", s.state));
      list.appendChild(li);
    });
    return list;
  }

  // Pips are the tries so far, drawn against the ladder. A finished feature draws only the tries it used.
  function pips(f) {
    var row = el("div", "pips");
    row.setAttribute("aria-hidden", "true");
    var count = f.state === "done" ? f.steps.used : f.steps.total;
    for (var i = 0; i < count; i++) {
      var on = i < f.steps.used;
      row.appendChild(el("span", "pip" + (on ? " on " + (i === 0 ? "first" : "reinf") : "")));
    }
    return row;
  }

  // A feature that was built and checked at the first try needs one calm line and nothing else.
  function firstTryDone(f) { return f.state === "done" && f.reinforcements === 0 && !f.recovered; }
  // Pips and the steps line are for tries that matter: reinforcements, or a feature that is not finished.
  // A feature that has not been tried yet has nothing to say about tries.
  function showTries(f) {
    if (f.steps.used === 0) return false;
    return f.reinforcements > 0 || f.state === "stuck" || f.state === "being_built" || f.state === "being_reviewed" || f.state === "paused";
  }

  // A feature checked by a second AI has no test files, so the number of test files says nothing about it. It carries the count of the
  // checks on its list instead, and, once it is done, the words for how it was checked (docs/modes-spec.md, 11.5): never "checked" alone.
  function byReading(f) { return typeof f.modeChecks === "number"; }

  function checksLine(f) {
    if (byReading(f)) {
      if (f.checkedBy) return el("p", "small muted", f.checkedBy);
      var k = f.modeChecks;
      if (k === 0) return null;
      return el("p", "small muted", k === 1 ? W.listOne : k + W.listMany);
    }
    var n = f.acceptanceTests;
    if (n === 0 && (f.state === "waiting_turn" || f.state === "left_out")) return null;
    var text = n === 0 ? W.checkNone : n === 1 ? W.checkOne : n + W.checkMany;
    return el("p", "small muted", text);
  }

  function tile(f, m, snap) {
    var lk = look(FEATURE_LOOK, f.state);
    var t = el("article", "tile");
    tone(t, lk.tone);
    var isNow = !!(snap.now && snap.now.featureId === f.id && snap.now.missionId === m.id);
    if (isNow) t.className += " is-now";
    var top = el("div", "tile-top");
    add(top, chip(lk, f.word));
    if (isNow) top.appendChild(el("span", "tag now", "Now"));
    if (f.isRepair) top.appendChild(el("span", "tag", W.repairFeature));
    var title = el("h4", "tile-title", f.title);
    add(t, top, title);
    add(t, said(f.reason, snap, "reason"));
    if (firstTryDone(f)) {
      t.className += " compact";
      var calm = el("p", "firsttry");
      add(calm, ic("check"), el("span", "", byReading(f) ? W.firstTryRead : W.firstTry));
      t.appendChild(calm);
      if (byReading(f) && f.checkedBy) t.appendChild(el("p", "small muted", f.checkedBy));
      return t;
    }
    if (showTries(f)) {
      var line = el("div", "steps-line");
      var n = f.reinforcements;
      var used = f.state === "done" ? "" : " (" + f.steps.used + " of " + f.steps.total + W.stepsUsed;
      add(line,
        el("p", "steps-text", W.reinforcementsLabel + (n === 0 ? W.none : String(n)) + used),
        pips(f),
        el("p", "small muted", f.steps.caption));
      t.appendChild(line);
    }
    if (f.recovered) {
      var r = el("p", "");
      var tag = el("span", "tag recovered");
      add(tag, ic("retry"), el("span", "", W.recovered));
      r.appendChild(tag);
      t.appendChild(r);
    }
    add(t, checksLine(f));
    var actions = el("div", "tile-actions");
    add(actions, tellButton(f.tellLeader, "tell:tile:" + m.id + ":" + f.id, title, true));
    if (f.state === "stuck" && f.cardId) {
      var open = el("button", "linkbtn", W.openQuestion);
      open.type = "button";
      open.setAttribute("data-key", "open:" + f.cardId);
      open.setAttribute("aria-describedby", ensureId(title, "t"));
      open.addEventListener("click", function () { goCard(f.cardId); });
      actions.appendChild(open);
    }
    t.appendChild(actions);
    return t;
  }

  // A finished mission keeps its head and folds its features away behind one control (a native details element:
  // Enter and Space open it, and the browser says whether it is open).
  function doneFold(m, tiles) {
    var n = m.features.length;
    var d = el("details", "donebox");
    if (state.doneOpen[m.id]) d.open = true;
    var sum = el("summary", "");
    sum.setAttribute("data-key", "done:" + m.id);
    function words() {
      return (n === 1 ? "The feature is done " : "All " + n + " features done ") + (d.open ? W.doneHide : W.doneShow);
    }
    sum.textContent = words();
    d.addEventListener("toggle", function () {
      state.doneOpen[m.id] = d.open;
      sum.textContent = words();
    });
    add(d, sum, tiles);
    return d;
  }

  function missionGroup(m, snap, several) {
    var lk = look(MISSION_LOOK, m.state);
    var group = el("section", "group");
    var head = el("div", "mission-head");
    tone(head, lk.tone);
    var titleRow = el("div", "mission-title");
    var h = el("h3", "", m.title);
    add(titleRow, h, el("span", "kind", m.kindWord), chip(lk, m.word));
    add(head, titleRow);
    // The lamp or the Now line may already say the same sentence: say it once.
    // A mission that needs your help has its card in the strip: its own "It needs your help." adds nothing.
    var carded = m.state === "needs_you" && snap.needsYou.some(function (c) { return c.missionId === m.id; });
    var repeated = carded || m.sentence === snap.lamp.sentence || (snap.now && m.sentence === snap.now.text);
    // A finished mission among several is folded away below: its steps and its count are not repeated.
    var folded = m.state === "done" && m.features.length > 0 && several;
    add(head, repeated ? null : el("p", "mission-sentence", m.sentence), folded ? null : stepper(m));
    // With one mission the heading above already says it; with several, each mission needs its own count.
    if (m.featuresTotal > 0 && several && !folded) head.appendChild(el("p", "small muted", m.featuresLine));
    if (m.features.length === 0) {
      var row = el("div", "tile-actions");
      row.appendChild(tellButton(m.tellLeader, "tell:mission:" + m.id, h, true));
      head.appendChild(row);
    }
    group.appendChild(head);
    if (m.features.length > 0) {
      var tiles = el("div", "tiles");
      m.features.forEach(function (f) { tiles.appendChild(tile(f, m, snap)); });
      group.appendChild(m.state === "done" ? doneFold(m, tiles) : tiles);
    }
    return group;
  }

  // The order of the groups: what needs a person first, then what is stuck, then the work, then what is finished.
  function groupRank(m, hasCard) {
    if (m.state === "needs_you") return 0;
    var stuck = m.features.some(function (f) { return f.state === "stuck"; });
    if (hasCard[m.id] || stuck || m.state === "partly_done" || m.state === "unknown") return 1;
    var order = { working: 2, waiting: 3, paused: 4, done: 5, not_started: 6 };
    return Object.prototype.hasOwnProperty.call(order, m.state) ? order[m.state] : 1;
  }

  function orderedMissions(list, snap) {
    var hasCard = {};
    snap.needsYou.forEach(function (c) { hasCard[c.missionId] = true; });
    return list
      .map(function (m, i) { return { m: m, i: i, rank: groupRank(m, hasCard) }; })
      .sort(function (a, b) { return a.rank - b.rank || a.i - b.i; })
      .map(function (x) { return x.m; });
  }

  // What the strip under the lamp says. It must never contradict the lamp: green only when the lamp is green.
  function strip(snap, lampState) {
    var cards = snap.needsYou;
    if (cards.length === 0) {
      if (lampState === "idle") return null;
      var calm = el("div", "strip calm");
      if (lampState === "on_track") {
        add(calm, ic("check"), el("span", "", W.emptyCards));
      } else {
        calm.className += " muted";
        calm.appendChild(el("span", "", W.calmLook));
      }
      return calm;
    }
    var worst = "warn";
    cards.forEach(function (c) { if (c.severity === "now") worst = "bad"; });
    var box = el("section", "strip");
    tone(box, worst);
    var title = el("div", "strip-title");
    add(title, ic(worst === "bad" ? "sq" : "tri"), el("span", "", "Needs you (" + cards.length + ")"));
    box.appendChild(title);
    cards.forEach(function (c) {
      var b = el("button", "strip-item");
      b.type = "button";
      b.setAttribute("data-key", "strip:" + c.id);
      tone(b, c.severity === "now" ? "bad" : "warn");
      var words = el("span", "strip-text");
      words.appendChild(el("span", "", c.title));
      var sub = stripSub(c);
      if (sub) words.appendChild(el("span", "strip-sub", sub));
      add(b, ic(CARD_ICON[c.kind] || "tri"), words, ic("chev", "go"));
      b.addEventListener("click", function () { goCard(c.id); });
      box.appendChild(b);
    });
    return box;
  }

  // The second line of a strip row: what to do, else what happened, but only when the engine wrote it.
  // An AI's text is never boiled down here: the quote on the card carries the label.
  function stripSub(c) {
    var todo = c.whatToDo;
    if (todo && todo.text && todo.author !== "ai") return firstSentence(todo.text);
    var what = c.happened;
    if (what && what.author === "engine" && what.text) return firstSentence(what.text);
    return "";
  }

  function resultsRow() {
    var b = el("button", "linkrow");
    b.type = "button";
    b.setAttribute("data-key", "results-link");
    add(b, ic("info"), el("span", "", W.resultsReady), ic("chev", "go"));
    b.addEventListener("click", function () {
      selectTab("results", false);
      requestAnimationFrame(function () { $("tabs").scrollIntoView({ block: "start" }); });
    });
    return b;
  }

  // Under the lamp: the strip, and a way to the Results tab when no run is live and results are ready.
  // It is drawn again when the snapshot or the lamp that is showing changes (the page's own clock can change the lamp).
  function paintUnderLamp(lamp) {
    var snap = state.snap;
    var key = state.sig + "|" + lamp.state;
    if (state.underKey === key) return;
    state.underKey = key;
    var frag = document.createDocumentFragment();
    add(frag, strip(snap, lamp.state));
    if (snap.debrief && !snap.run.active) frag.appendChild(resultsRow());
    var slot = $("under-lamp");
    clear(slot);
    slot.appendChild(frag);
  }

  // The quiet row: missions from an earlier run that are still open. It never changes the lamp by itself.
  function earlierRow(snap) {
    var earlier = snap.missions.filter(function (m) { return m.scope === "earlier"; });
    if (earlier.length === 0) return null;
    var d = el("details", "earlier");
    if (state.earlierOpen) d.open = true;
    d.addEventListener("toggle", function () { state.earlierOpen = d.open; });
    var count = typeof snap.counts.openFromEarlier === "number" ? snap.counts.openFromEarlier : earlier.length;
    var sum = el("summary", "", W.earlierOpen + count + ")");
    sum.setAttribute("data-key", "earlier");
    d.appendChild(sum);
    var list = el("div", "earlier-list");
    earlier.forEach(function (m) {
      var lk = look(MISSION_LOOK, m.state);
      var item = el("div", "earlier-item");
      var titleRow = el("div", "mission-title");
      var h = el("h4", "", m.title);
      add(titleRow, h, chip(lk, m.word));
      add(item, titleRow, el("p", "small", m.sentence), tellButton(m.tellLeader, "tell:earlier:" + m.id, h, true));
      list.appendChild(item);
    });
    d.appendChild(list);
    return d;
  }

  function gauge(w, provider) {
    var wrap = el("div", "win");
    var head = el("div", "win-head");
    add(head, el("span", "", w.label), el("span", "num", w.text));
    var track = el("div", "track");
    track.setAttribute("role", "img");
    track.setAttribute("aria-label", provider.label + ", " + w.label + ": " + w.text);
    var level = w.overage || w.usedFraction >= 0.9 ? " bad" : w.usedFraction >= 0.7 ? " warn" : "";
    var fill = el("div", "fill" + level + (w.overage ? " over" : ""));
    fill.style.width = Math.max(0, Math.min(100, w.fill * 100)) + "%";
    track.appendChild(fill);
    add(wrap, head, track);
    if (w.pauseAt !== null && w.pauseAt !== undefined) {
      var at = Math.max(0, Math.min(100, w.pauseAt * 100)) + "%";
      var tick = el("div", "tick");
      tick.style.left = at;
      track.appendChild(tick);
      var cap = el("div", "cap");
      var label = el("span", "", W.pauseHere);
      label.style.left = at;
      cap.appendChild(label);
      wrap.appendChild(cap);
    }
    return wrap;
  }

  function providerRow(p, compact) {
    var lk = look(PILL_LOOK, p.pill.state);
    var row = el("div", "prov");
    var head = el("div", "prov-head");
    add(head, el("span", "name", p.label), chip(lk, p.pill.word));
    row.appendChild(head);
    if (!compact) p.windows.forEach(function (w) { row.appendChild(gauge(w, p)); });
    if (p.limitedText) row.appendChild(el("p", "", p.limitedText));
    if (p.note && (!compact || p.windows.length === 0)) row.appendChild(el("p", "small muted", p.note));
    return row;
  }

  function allowanceSection(snap) {
    var a = snap.allowance;
    var box = el("section", "allowance");
    box.appendChild(el("h2", "", W.allowance));
    if (a.waiting) {
      var banner = el("p", "banner");
      add(banner, ic("clock"), el("span", "", a.waiting.text));
      box.appendChild(banner);
    }
    var list = el("div", "providers");
    a.providers.forEach(function (p) { list.appendChild(providerRow(p, false)); });
    box.appendChild(list);
    if (a.fileChangedText) box.appendChild(el("p", "foot-note", a.fileChangedText));
    return box;
  }

  function renderNow(snap) {
    var body = $("now-body");
    var frag = document.createDocumentFragment();
    var features = el("section", "features");
    var current = orderedMissions(snap.missions.filter(function (m) { return m.scope !== "earlier"; }), snap);
    // With nothing planned there is one line to say so, not a heading and a line. With only earlier work open
    // the quiet row below is the answer, so the line is left out ("No missions yet" above a listed mission would contradict it).
    if (current.length === 0) { if (snap.missions.length === 0) features.appendChild(el("p", "empty", W.emptyMissions)); }
    else features.appendChild(el("h2", "", snap.counts.featuresLine));
    current.forEach(function (m) { features.appendChild(missionGroup(m, snap, current.length > 1)); });
    var cutMissions = snap.counts.missionsNotShown;
    if (cutMissions > 0) features.appendChild(el("p", "small muted", cutMissions === 1 ? W.missionNotShown : cutMissions + W.missionsNotShown));
    if (features.firstChild) frag.appendChild(features);
    add(frag, earlierRow(snap), allowanceSection(snap));
    clear(body);
    body.appendChild(frag);
  }

  // ---------------------------------------------------------------------------------------------
  // The lamp and the freshness line (these run on the page's own clock)
  // ---------------------------------------------------------------------------------------------
  function effectiveLamp(snap, level) {
    if (level >= 2) return snap.freshness.notResponding;
    if (level === 1 && snap.lamp.state !== "needs_you_now") return snap.freshness.notUpdating;
    return snap.lamp;
  }

  function setText(node, text) { if (node.textContent !== text) node.textContent = text; }

  function paintLamp() {
    var snap = state.snap;
    if (!snap) return;
    var lamp = effectiveLamp(snap, state.level);
    var lk = look(LAMP_LOOK, lamp.state);
    var card = $("lamp");
    tone(card, lk.tone);
    var icon = $("lamp-icon");
    if (icon.getAttribute("data-icon") !== lk.icon) {
      clear(icon);
      icon.appendChild(ic(lk.icon));
      icon.setAttribute("data-icon", lk.icon);
    }
    setText($("lamp-word"), lamp.word);
    setText($("lamp-sentence"), lamp.sentence);
    var lines = $("lamp-lines");
    clear(lines);
    lines.className = state.level > 0 ? "lamp-lines old" : "lamp-lines";
    // Not responding: the live lines ("running 10 s", "Last activity 7 s ago") are frozen and would look live. Leave them out.
    if (state.level < 2) {
      if (snap.run.line) lines.appendChild(el("li", "", snap.run.line));
      if (snap.run.activityLine) lines.appendChild(el("li", "", snap.run.activityLine));
      // The Now line is dropped when the lamp sentence already says the same thing.
      if (snap.now && snap.now.text !== lamp.sentence) {
        var li = el("li", "");
        li.appendChild(el("span", "label", "Now:"));
        li.appendChild(document.createTextNode(" " + snap.now.text + (snap.now.sinceText ? " (" + snap.now.sinceText + ")" : "")));
        lines.appendChild(li);
      }
    }
    $("main").className = state.level >= 2 ? "gone" : "";
    paintUnderLamp(lamp);
    paintNeedsEmpty(lamp.state);
  }

  // Stopping only makes sense while a run is on or a stop is already asked for.
  function paintGbar(snap) {
    $("gbar-stop").hidden = !(snap.run.active || snap.run.stopRequested);
  }

  function paintFresh() {
    var snap = state.snap;
    if (!snap) return;
    var secs = Math.max(0, Math.floor((nowMs() - state.lastOk) / 1000));
    var ago = secs < 60 ? secs + " s ago)" : Math.floor(secs / 60) + " min ago)";
    setText($("fresh-text"), W.updated + snap.generatedAtText + " (" + ago);
    var stale = $("fresh-stale");
    stale.hidden = state.level < 1;
    setText(stale, snap.freshness.notUpdatingText);
  }

  function tick() {
    if (!state.snap || state.versionBad) return;
    var f = freshness();
    var silence = nowMs() - state.lastOk;
    var level = silence >= f.gone ? 2 : silence >= f.stale ? 1 : 0;
    if (level !== state.level) {
      state.level = level;
      paintLamp();
    }
    paintFresh();
  }

  function paintNotice() {
    var node = $("notice");
    var text = state.versionBad ? W.badVersion : state.firstFailed && !state.snap ? W.cannotReach : "";
    node.hidden = text === "";
    setText(node, text);
  }

  // ---------------------------------------------------------------------------------------------
  // Needs you
  // ---------------------------------------------------------------------------------------------
  function card(c, snap) {
    var t = c.severity === "now" ? "bad" : "warn";
    var art = el("article", "card");
    tone(art, t);
    art.setAttribute("data-card-id", c.id);
    var head = el("div", "card-h");
    var h = el("h3", "", c.title);
    h.setAttribute("tabindex", "-1");
    var titleBox = el("div", "");
    add(titleBox, h, el("p", "of", c.missionTitle));
    add(head, ic(CARD_ICON[c.kind] || "tri"), titleBox);
    var body = el("div", "card-body");
    var what = el("div", "sect");
    add(what, el("h4", "section-label", W.happened), said(c.happened, snap, ""));
    if (c.summary) what.appendChild(el("p", "small muted", c.summary));
    // A check the owner asked for: what to look at, line by line. One label for the list, then each line as a plain quote.
    if (c.lines && c.lines.length) {
      var lookBox = el("div", "look");
      lookBox.appendChild(aiLabel(snap.leader.aiNotice));
      c.lines.forEach(function (line) { lookBox.appendChild(quoted(line)); });
      add(what, el("h4", "section-label", W.lookAt), lookBox);
    }
    var nothing = el("div", "sect");
    add(nothing, el("h4", "section-label", W.ifNothing), el("p", "", c.ifNothing));
    // Only when the engine knows the next step: the person is named, the AI is named when known.
    var todo = null;
    if (c.whatToDo && c.whatToDo.text) {
      todo = el("div", "sect");
      add(todo, el("h4", "section-label", W.whatToDo), said(c.whatToDo, snap, ""));
    }
    add(body, what, todo, nothing);
    var foot = el("div", "card-foot");
    // A check has two answers. They are sentences to copy, like every other button here: this page never sends an approval.
    if (c.answers) {
      foot.appendChild(tellButton(c.answers.approve, "tell:approve:" + c.id, h, false, W.approveBtn, false));
      foot.appendChild(tellButton(c.answers.sendBack, "tell:sendback:" + c.id, h, false, W.sendBackBtn, true));
    }
    foot.appendChild(tellButton(c.tellLeader, "tell:card:" + c.id, h, !!c.answers));
    add(art, head, body, foot);
    return art;
  }

  // With no cards, the Needs you tab says what the lamp that is showing allows: "Nothing needs you right now." only
  // beside a green or grey lamp, else a pointer to the note on the Now tab (the same rule as the strip under the lamp).
  function needsEmptyWords(lampState) {
    return lampState === "on_track" || lampState === "idle" ? W.emptyCards : W.calmLookNeeds;
  }

  // The page's own clock can change the lamp, so the empty line is found again and rewritten when it does.
  function paintNeedsEmpty(lampState) {
    var node = document.querySelector('[data-empty="needs"]');
    if (node) setText(node, needsEmptyWords(lampState));
  }

  function renderNeeds(snap) {
    var panel = $("panel-needs");
    var frag = document.createDocumentFragment();
    var n = snap.needsYou.length;
    frag.appendChild(el("h2", "", n > 0 ? "Needs you (" + n + ")" : "Needs you"));
    frag.appendChild(el("p", "", W.needsTop));
    if (n === 0) {
      var empty = el("p", "empty", needsEmptyWords(effectiveLamp(snap, state.level).state));
      empty.setAttribute("data-empty", "needs");
      frag.appendChild(empty);
    } else {
      var list = el("div", "cards");
      snap.needsYou.forEach(function (c) { list.appendChild(card(c, snap)); });
      frag.appendChild(list);
    }
    var cutCards = snap.counts.cardsNotShown;
    if (cutCards > 0) frag.appendChild(el("p", "small muted", cutCards === 1 ? W.cardNotShown : cutCards + W.cardsNotShown));
    clear(panel);
    panel.appendChild(frag);
  }

  function goCard(cardId) {
    selectTab("needs", false);
    var node = document.querySelector('[data-card-id="' + cssEscape(cardId) + '"]');
    if (!node) return;
    var heading = node.querySelector("h3");
    if (heading) heading.focus({ preventScroll: true });
    // After the tab has been laid out, so the card sits a little below the top edge and its border shows.
    requestAnimationFrame(function () { node.scrollIntoView({ block: "start" }); });
  }

  // ---------------------------------------------------------------------------------------------
  // Timeline
  // ---------------------------------------------------------------------------------------------
  function renderTimeline(snap) {
    var panel = $("panel-timeline");
    var frag = document.createDocumentFragment();
    frag.appendChild(el("h2", "", "Timeline"));
    var items = snap.timeline.items;
    var box = el("div", "timeline");
    if (snap.timeline.earlierNotShown > 0) box.appendChild(el("p", "small muted", W.earlierEvents + snap.timeline.earlierNotShown + ")."));
    if (items.length === 0) {
      box.appendChild(el("p", "empty", W.emptyTimeline));
    } else {
      var titles = {};
      snap.missions.forEach(function (m) { titles[m.id] = m.title; });
      var seen = {};
      items.forEach(function (it) { seen[it.missionId] = true; });
      var manyMissions = Object.keys(seen).length > 1;
      var days = [];
      items.forEach(function (it) {
        var d = days.length && days[days.length - 1].label === it.day ? days[days.length - 1] : null;
        if (!d) { d = { label: it.day, groups: [], byMission: {} }; days.push(d); }
        var g = d.byMission[it.missionId];
        if (!g) { g = { id: it.missionId, items: [] }; d.byMission[it.missionId] = g; d.groups.push(g); }
        g.items.push(it);
      });
      days.forEach(function (d) {
        box.appendChild(el("h3", "day", d.label));
        d.groups.forEach(function (g) {
          if (manyMissions && titles[g.id]) box.appendChild(el("p", "tl-mission", titles[g.id]));
          var list = el("ul", "tl");
          g.items.forEach(function (it) {
            var lk = look(TONE_LOOK, it.tone);
            var li = el("li", "tl-item");
            tone(li, lk.tone);
            var body = el("div", "tl-body");
            body.appendChild(el("p", "tl-text", it.text + (it.count > 1 ? " (" + it.count + " times)" : "")));
            if (it.note) body.appendChild(said(it.note, snap, ""));
            add(li, el("span", "tl-time", it.time), ic(lk.icon), body);
            list.appendChild(li);
          });
          box.appendChild(list);
        });
      });
    }
    frag.appendChild(box);
    clear(panel);
    panel.appendChild(frag);
  }

  // ---------------------------------------------------------------------------------------------
  // Results (the snapshot calls them `debrief`)
  // ---------------------------------------------------------------------------------------------
  // `once`: short AI-written lines (what was built). The label comes once at the top of the list and each line is a
  // plain quote. Without it (what did not get finished) every AI text keeps its own box and label.
  function featureList(heading, items, snap, once) {
    if (!items.length) return null;
    var sect = el("div", "list-block");
    var list = el("ul", "list");
    var anyAi = false;
    items.forEach(function (f) {
      var li = el("li", "");
      if (once && f.note && f.note.author === "ai") anyAi = true;
      add(li, el("p", "name", f.title), once ? quoted(f.note, "muted") : said(f.note, snap, "muted"));
      // How the feature was checked, when the snapshot says (only for a mission with a feature checked by a second AI).
      if (f.checkedBy) li.appendChild(el("p", "small muted", f.checkedBy));
      list.appendChild(li);
    });
    add(sect, el("h4", "section-label", heading), anyAi ? aiLabel(snap.leader.aiNotice) : null, list);
    return sect;
  }

  function tickRow(t) {
    var lk = look(TICK_LOOK, t.state);
    var row = el("div", "tick-row");
    tone(row, lk.tone);
    var body = el("div", "");
    var head = el("div", "tick-head");
    add(head, el("span", "tick-label", t.label), el("span", "tick-state", lk.word));
    add(body, head, el("p", "", t.why));
    if (t.caveat) {
      var cv = el("p", "caveat");
      add(cv, ic("tri"), el("span", "", t.caveat));
      body.appendChild(cv);
    }
    add(row, ic(lk.icon), body);
    return row;
  }

  function resultsMission(d, snap) {
    var lk = look(VERDICT_LOOK, d.verdict.id);
    var box = el("section", "dmission");
    var head = el("div", "dhead");
    var h = el("h3", "", d.title);
    add(head, h, chip(lk, d.verdict.word));
    add(box, head, el("p", "", d.verdict.sentence));
    add(box, featureList(W.gotHeading, d.got, snap, true));
    add(box, featureList(W.notFinished, d.leftOut, snap, false));
    add(box, featureList(W.recovered, d.recovered, snap, true));
    var result = el("div", "list-block");
    add(result, el("h4", "section-label", W.howItWent), el("p", "small muted", d.plannedLine));
    var ticks = el("div", "ticks");
    d.ticks.forEach(function (t) { ticks.appendChild(tickRow(t)); });
    result.appendChild(ticks);
    box.appendChild(result);
    if (d.agentTimeText) {
      var runs = d.agentRuns === null || d.agentRuns === undefined ? "" : " (" + d.agentRuns + (d.agentRuns === 1 ? " AI run)" : " AI runs)");
      box.appendChild(el("p", "small muted", d.agentTimeText + runs));
    }
    var foot = el("div", "tile-actions");
    foot.appendChild(tellButton(d.tellLeader, "tell:results:" + d.missionId, h, true));
    box.appendChild(foot);
    return box;
  }

  function renderResults(snap) {
    var panel = $("panel-results");
    var frag = document.createDocumentFragment();
    frag.appendChild(el("h2", "", "Results"));
    var d = snap.debrief;
    if (!d) {
      frag.appendChild(el("p", "empty", W.emptyResults));
    } else {
      var wrap = el("div", "results");
      var vk = look(VERDICT_LOOK, d.verdict.id);
      var verdict = el("div", "verdict");
      tone(verdict, vk.tone);
      var words = el("div", "");
      add(words, el("div", "verdict-word", d.verdict.word), el("p", "verdict-sentence", d.verdict.sentence));
      add(verdict, ic(vk.icon), words);
      wrap.appendChild(verdict);
      d.missions.forEach(function (m) { wrap.appendChild(resultsMission(m, snap)); });
      var allow = el("section", "dmission");
      allow.appendChild(el("h4", "section-label", W.allowanceNow));
      var pills = el("div", "pills");
      snap.allowance.providers.forEach(function (p) {
        var item = el("div", "p");
        add(item, el("span", "name", p.label), chip(look(PILL_LOOK, p.pill.state), p.pill.word));
        pills.appendChild(item);
      });
      allow.appendChild(pills);
      var notes = el("div", "notes");
      add(notes, el("p", "", d.allowanceNote), el("p", "", d.honestyNote));
      allow.appendChild(notes);
      wrap.appendChild(allow);
      frag.appendChild(wrap);
    }
    clear(panel);
    panel.appendChild(frag);
  }

  // ---------------------------------------------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------------------------------------------
  function paintTabs(snap) {
    var n = snap.needsYou.length;
    setText($("tab-needs"), n > 0 ? "Needs you (" + n + ")" : "Needs you");
    TABS.forEach(function (name) {
      var on = name === state.tab;
      var tab = $("tab-" + name);
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.setAttribute("tabindex", on ? "0" : "-1");
      $("panel-" + name).hidden = !on;
    });
  }

  function selectTab(name, focusTab) {
    if (TABS.indexOf(name) < 0) return;
    state.tab = name;
    if (state.snap) paintTabs(state.snap);
    if (focusTab) $("tab-" + name).focus();
  }

  $("tabs").addEventListener("click", function (e) {
    var tab = e.target.closest ? e.target.closest(".tab") : null;
    if (tab) selectTab(tab.getAttribute("data-tab"), false);
  });
  $("tabs").addEventListener("keydown", function (e) {
    var at = TABS.indexOf(state.tab);
    var next = -1;
    if (e.key === "ArrowRight") next = (at + 1) % TABS.length;
    else if (e.key === "ArrowLeft") next = (at + TABS.length - 1) % TABS.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = TABS.length - 1;
    if (next < 0) return;
    e.preventDefault();
    selectTab(TABS[next], true);
  });

  // ---------------------------------------------------------------------------------------------
  // Drawing a snapshot. A poll must not move the focus, so the focused control is found again by its key.
  // ---------------------------------------------------------------------------------------------
  function renderAll() {
    var snap = state.snap;
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute("data-key") : null;
    $("tabs").hidden = false;
    $("main").hidden = false;
    $("gbar").hidden = false;
    paintGbar(snap);
    paintLamp();
    renderNow(snap);
    renderNeeds(snap);
    renderTimeline(snap);
    renderResults(snap);
    paintTabs(snap);
    paintFresh();
    if (key && (!active.isConnected || !document.contains(active))) {
      var again = document.querySelector('[data-key="' + cssEscape(key) + '"]');
      if (again && again.focus) again.focus({ preventScroll: true });
    }
  }

  // Two snapshots that differ only in their build time draw the same page, so nothing is redrawn (a selection stays).
  function signature(snap) {
    var at = snap.generatedAt;
    var text = snap.generatedAtText;
    snap.generatedAt = 0;
    snap.generatedAtText = "";
    var sig = JSON.stringify(snap);
    snap.generatedAt = at;
    snap.generatedAtText = text;
    return sig;
  }

  function show(snap) {
    if (!snap || snap.schemaVersion !== SCHEMA) {
      state.versionBad = true;
      paintNotice();
      return;
    }
    state.versionBad = false;
    state.firstFailed = false;
    var sig = signature(snap);
    var changed = sig !== state.sig;
    state.snap = snap;
    state.sig = sig;
    paintNotice();
    if (changed || $("main").hidden) {
      try {
        state.level = 0;
        renderAll();
      } catch (err) {
        state.snap = null;
        state.sig = "";
        state.versionBad = true;
        paintNotice();
        return;
      }
    } else {
      state.level = 0;
      paintLamp();
      paintFresh();
    }
  }

  // ---------------------------------------------------------------------------------------------
  // Asking the server, on the page's own clock
  // ---------------------------------------------------------------------------------------------
  function schedule() {
    clearTimeout(state.pollTimer);
    state.pollTimer = setTimeout(poll, freshness().poll);
  }

  function poll() {
    if (state.polling) return;
    state.polling = true;
    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, FETCH_TIMEOUT_MS);
    var options = { cache: "no-store" };
    if (ctl) options.signal = ctl.signal;
    fetch("/api/snapshot", options)
      .then(function (res) {
        if (!res.ok) throw new Error("not ok");
        return res.json();
      })
      .then(function (snap) {
        clearTimeout(timer);
        state.lastOk = Date.now();
        show(snap);
      })
      .catch(function () {
        clearTimeout(timer);
        if (!state.snap) {
          state.firstFailed = true;
          paintNotice();
        }
      })
      .then(function () {
        state.polling = false;
        schedule();
      });
  }

  document.addEventListener("visibilitychange", function () {
    // A tab that slept has old news; ask again at once instead of waiting for the timer.
    if (!DEMO && document.visibilityState === "visible" && !state.polling) {
      clearTimeout(state.pollTimer);
      poll();
    }
  });

  // ---------------------------------------------------------------------------------------------
  // Demo mode: the same page, one JSON block, no server. The clock stands still at the snapshot's build time.
  // ---------------------------------------------------------------------------------------------
  function demoName() {
    var match = /^#demo=([A-Za-z0-9_-]+)/.exec(location.hash);
    var names = Object.keys(DEMO);
    if (match && Object.prototype.hasOwnProperty.call(DEMO, match[1])) return match[1];
    return Object.prototype.hasOwnProperty.call(DEMO, "done") ? "done" : names[0];
  }

  function showDemo() {
    var name = demoName();
    var snap = DEMO[name];
    if (!snap) return;
    closeSheet();
    var links = $("demo-links");
    var current = links.children;
    for (var i = 0; i < current.length; i++) {
      if (current[i].getAttribute("data-demo") === name) current[i].setAttribute("aria-current", "page");
      else current[i].removeAttribute("aria-current");
    }
    state.lastOk = snap.generatedAt;
    state.sig = "";
    show(snap);
  }

  function startDemo() {
    $("demo-bar").hidden = false;
    var links = $("demo-links");
    Object.keys(DEMO).forEach(function (name) {
      var a = el("a", "demo-link", name.replace(/-/g, " "));
      a.setAttribute("href", "#demo=" + name);
      a.setAttribute("data-demo", name);
      links.appendChild(a);
    });
    window.addEventListener("hashchange", showDemo);
    // The demo bar sticks to the top: a card scrolled into view must clear it.
    function offset() { document.documentElement.style.setProperty("--sticky-top", $("demo-bar").offsetHeight + "px"); }
    window.addEventListener("resize", offset);
    offset();
    showDemo();
  }

  // ---------------------------------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------------------------------
  setInterval(tick, 1000);
  if (DEMO) {
    startDemo();
  } else {
    poll();
  }
})();
</script>
</body>
</html>
